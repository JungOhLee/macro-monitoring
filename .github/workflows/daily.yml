name: daily

on:
  schedule:
    - cron: "17 11 * * *"   # ~06:17 ET
    - cron: "17 21 * * *"   # catch-up; pipeline is idempotent
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python -m pipeline run
          python -m pipeline export
          python -m pipeline backtest
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data site/data site/episodes
          if ! git diff --cached --quiet; then
            git commit -m "data: daily update"
          else
            echo "nothing to commit"
          fi
          git pull --rebase --autostash origin main
          git push
      - name: Alerts
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline alerts
      - name: Refresh site JSON for artifact (push builds)
        if: github.event_name == 'push'
        run: python -m pipeline export || true   # tolerate empty data on very first push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # keep site/.nojekyll; v4+ drops dotfiles by default
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # deploy-pages hard-caps its timeout at 10m, so a slow Pages queue can't be
      # waited out -- it has to be retried. A queued deployment is cancelled on
      # timeout, so the second attempt starts a fresh one.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
